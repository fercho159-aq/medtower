<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MIT Medical Tower">
  <!-- Torre / edificio -->
  <rect x="11" y="14" width="18" height="30" rx="2.5" fill="#0e1555"/>
  <rect x="27" y="20" width="11" height="24" rx="2.5" fill="#1e3a8a"/>
  <!-- Ventanas torre principal -->
  <g fill="#4ec3cd">
    <rect x="15" y="20" width="4" height="4" rx="1"/>
    <rect x="21" y="20" width="4" height="4" rx="1"/>
    <rect x="15" y="27" width="4" height="4" rx="1"/>
    <rect x="21" y="27" width="4" height="4" rx="1"/>
    <rect x="15" y="34" width="4" height="4" rx="1"/>
    <rect x="21" y="34" width="4" height="4" rx="1"/>
  </g>
  <!-- Ventanas torre secundaria -->
  <g fill="#60a5fa">
    <rect x="30.5" y="25" width="3.5" height="3.5" rx="1"/>
    <rect x="30.5" y="31" width="3.5" height="3.5" rx="1"/>
    <rect x="30.5" y="37" width="3.5" height="3.5" rx="1"/>
  </g>
  <!-- Cruz médica -->
  <g fill="#2563eb">
    <rect x="17.5" y="4" width="5" height="9" rx="1.4"/>
    <rect x="15.5" y="6" width="9" height="5" rx="1.4"/>
  </g>
</svg>
